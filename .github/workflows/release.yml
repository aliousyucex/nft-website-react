name: Build and Deploy
on:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        run: |
          docker build -t ghcr.io/aliousyucex/nft-backend:${{ github.event.release.tag_name }} ./apps/backend
          docker push ghcr.io/aliousyucex/nft-backend:${{ github.event.release.tag_name }}

      - name: Build and push Frontend
        run: |
          docker build \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            --build-arg VITE_WS_URL=${{ secrets.VITE_WS_URL }} \
            --build-arg VITE_CONTRACT_ADDRESS=${{ secrets.VITE_CONTRACT_ADDRESS }} \
            --build-arg VITE_CHAIN_ID=${{ secrets.VITE_CHAIN_ID }} \
            --build-arg VITE_WALLETCONNECT_PROJECT_ID=${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }} \
            -t ghcr.io/aliousyucex/nft-frontend:${{ github.event.release.tag_name }} \
            ./apps/frontend
          docker push ghcr.io/aliousyucex/nft-frontend:${{ github.event.release.tag_name }}