name: Build and Deploy
on:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        run: |
          docker build -t ghcr.io/${{ github.repository }}-backend:${{ github.event.release.tag_name }} ./apps/backend
          docker push ghcr.io/${{ github.repository }}-backend:${{ github.event.release.tag_name }}

      - name: Build and push Frontend
        run: |
          docker build -t ghcr.io/${{ github.repository }}-frontend:${{ github.event.release.tag_name }} ./apps/frontend
          docker push ghcr.io/${{ github.repository }}-frontend:${{ github.event.release.tag_name }}