name: Build Test
on:
  pull_request:
    branches: [ "master", "development" ]
    
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Build Backend
        run: docker build -t nft-backend ./apps/backend
        
      - name: Build Frontend
        run: docker build -t nft-frontend ./apps/frontend